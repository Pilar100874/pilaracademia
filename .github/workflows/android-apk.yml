name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - run: npm run build

      - name: Add Android platform (first run)
        run: npx cap add android || true

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pilaracademia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar APK para download direto
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pilaracademia.apk

      # Publica/atualiza a release "latest" para o link direto de download
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pilar Academia — app Android
          files: pilaracademia.apk
