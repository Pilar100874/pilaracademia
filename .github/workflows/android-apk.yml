name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 exige JDK 21 (sourceCompatibility VERSION_21);
      # com JDK 17 o Gradle falha na compilação.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # O runner ubuntu-latest do GitHub já traz o Android SDK instalado
      # (ANDROID_HOME configurado) — não é necessário o setup-android,
      # que falhava ao aceitar licenças via sdkmanager.
      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - run: npm ci

      - run: npm run build

      - name: Add Android platform (first run)
        run: npx cap add android || true

      # @capgo/capacitor-health exige minSdk 26; o template do Capacitor usa 24
      # e o manifest merger falha sem este ajuste.
      - name: Ajustar minSdkVersion para 26
        run: sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle

      # Gera os ícones do Android (adaptativo: frente + fundo da mesma cor,
      # evitando "ícone dentro do ícone").
      - name: Gerar ícones do app
        run: |
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#4d5665' --iconBackgroundColorDark '#4d5665' \
            --splashBackgroundColor '#4d5665' --splashBackgroundColorDark '#4d5665'

      # Garante que nenhum ícone padrão do Capacitor sobre: sobrescreve todos
      # os mipmaps legados com o ícone do app.
      - name: Forçar ícones do app
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          from PIL import Image
          import os
          res = 'android/app/src/main/res'
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          icon = Image.open('assets/icon-only.png').convert('RGBA')
          fg = Image.open('assets/icon-foreground.png').convert('RGBA')
          for k, s in sizes.items():
              d = f'{res}/mipmap-{k}'
              os.makedirs(d, exist_ok=True)
              icon.resize((s, s), Image.LANCZOS).save(f'{d}/ic_launcher.png')
              icon.resize((s, s), Image.LANCZOS).save(f'{d}/ic_launcher_round.png')
              f = s * 9 // 4
              fg.resize((f, f), Image.LANCZOS).save(f'{d}/ic_launcher_foreground.png')
          EOF
          sed -i 's/#FFFFFF/#4d5665/I' android/app/src/main/res/values/ic_launcher_background.xml 2>/dev/null || true

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pilaracademia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar APK para download direto
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pilaracademia.apk

      # Publica/atualiza a release "latest" para o link direto de download
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pilar Academia — app Android
          files: pilaracademia.apk
